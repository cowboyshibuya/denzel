name: Denzel
options:
  bundleIdPrefix: com.denzel
configs:
  Debug: debug
  Release: release
packages:
  Denzel:
    path: ..
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
targets:
  Denzel:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources: [Denzel]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.denzel.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Denzel
        INFOPLIST_KEY_NSHumanReadableCopyright: "Licensed under MPL-2.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Sparkle feed. SUPublicEDKey is a placeholder: run Sparkle's
        # `generate_keys` once (it prints the *existing* public key rather
        # than making a new one if a private key is already in this Mac's
        # keychain) and paste the real value in before shipping updates —
        # see README.
        INFOPLIST_KEY_SUFeedURL: "https://cowboyshibuya.github.io/denzel/appcast.xml"
        INFOPLIST_KEY_SUPublicEDKey: "REPLACE_WITH_GENERATE_KEYS_OUTPUT"
      configs:
        Debug:
          ENABLE_HARDENED_RUNTIME: NO
        Release:
          ENABLE_HARDENED_RUNTIME: YES
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
          DEVELOPMENT_TEAM: X9A3WYS8ZQ
    dependencies:
      - package: Denzel
        product: DenzelCore
      - package: Denzel
        product: DenzelRules
      - package: Sparkle
        product: Sparkle
