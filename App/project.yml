name: Denzel
options:
  bundleIdPrefix: com.denzel
configs:
  Debug: debug
  Release: release
packages:
  Denzel:
    path: ..
targets:
  Denzel:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources: [Denzel]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.denzel.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_HARDENED_RUNTIME: false
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Denzel
        INFOPLIST_KEY_NSHumanReadableCopyright: "Licensed under MPL-2.0"
    dependencies:
      - package: Denzel
        product: DenzelCore
      - package: Denzel
        product: DenzelRules
